<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Global Roast 100 | 全球咖啡新豆榜</title>
    <style>
        /* --- iOS 设计语言 --- */
        :root {
            --bg: #050505;
            --surface: #121212;
            --surface-blur: rgba(18, 18, 18, 0.85);
            --primary: #D4AF37; /* 奢华金 */
            --text-main: #F5F5F7;
            --text-sec: #86868B;
            --border: rgba(255, 255, 255, 0.08);
            --max-width: 1280px; /* 核心：严格限制最大宽度 */
            --gap: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            /* 黄金字体栈 */
            font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 1. 沉浸式 Header --- */
        header {
            padding: 90px 20px 50px;
            text-align: center;
            background: linear-gradient(180deg, #000 0%, var(--bg) 100%);
        }

        .brand-mark {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            margin: 0 0 20px 0;
            line-height: 1.1;
            color: #fff;
            letter-spacing: 1px;
        }

        h1 .en {
            display: block;
            font-family: "Didot", "Times New Roman", serif;
            font-size: 24px;
            font-style: italic;
            font-weight: 400;
            color: var(--text-sec);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Slogan 装饰线 */
        .slogan-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .slogan-line {
            width: 30px;
            height: 1px;
            background: var(--border);
        }

        .slogan {
            font-size: 13px;
            color: var(--text-sec);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- 2. 悬浮筛选栏 (对齐修正版) --- */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--surface-blur);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
            width: 100%;
        }

        /* 内部容器：严格限制宽度，与下方 Grid 对齐 */
        .filter-content {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 12px 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 地区 Tabs */
        .region-tabs {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .region-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sec);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0;
            position: relative;
            white-space: nowrap;
            transition: color 0.3s;
        }

        .tab-btn.active { color: #fff; }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* 品牌 Tags */
        .roaster-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .roaster-scroll::-webkit-scrollbar { display: none; }

        .tag {
            flex-shrink: 0;
            height: 30px;
            padding: 0 16px;
            border-radius: 15px;
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            font-size: 13px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .tag:hover { border-color: #555; background: rgba(255,255,255,0.1); }
        
        .tag.active {
            background: var(--text-main);
            color: #000;
            font-weight: 600;
        }

        /* --- 3. 工具栏 (统计 + 排序) --- */
        .toolbar {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 25px 30px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sec);
        }

        .sort-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: right;
            padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M6%209l6%206%206-6%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 12px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .sort-select:hover { opacity: 1; }

        /* --- 4. 网格系统 --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 40px 30px;
            padding: 20px 30px 100px;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* 卡片 */
        .card {
            display: block;
            text-decoration: none;
            background: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .card:hover .img-box img { transform: scale(1.05); }
        .card:hover .bean-title { color: #fff; }

        .img-box {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #1a1a1a;
            border-radius: 4px; /* iOS 相册风格，直角微圆 */
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .img-box img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.3s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
        }
        .img-box img.loaded { opacity: 1; }

        /* SVG 占位 */
        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            background: #111;
        }

        .info { display: flex; flex-direction: column; }

        .roaster {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .bean-title {
            font-size: 15px;
            color: #ddd;
            line-height: 1.5;
            font-weight: 400;
            margin-bottom: 8px;
            height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s;
        }

        .price {
            font-family: "SF Mono", monospace;
            font-size: 12px;
            color: var(--text-sec);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 11px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            h1 { font-size: 32px; }
            h1 .en { font-size: 18px; }
            
            .filter-content, .toolbar, .grid {
                padding-left: 20px;
                padding-right: 20px;
            }
            
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 15px;
            }
            
            .bean-title { font-size: 13px; height: 39px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-mark">GR100</div>
        <h1>
            全球咖啡新豆榜
            <span class="en">Global Roast Selection</span>
        </h1>
        <div class="slogan-container">
            <div class="slogan-line"></div>
            <div class="slogan">每日追踪 100+ 顶级烘焙品牌 · 甄选 30 天内新鲜出品</div>
            <div class="slogan-line"></div>
        </div>
    </header>

    <div class="sticky-header">
        <div class="filter-content">
            <div class="region-tabs" id="region-tabs">
                <button class="tab-btn active" data-region="all">全部地区</button>
                <button class="tab-btn" data-region="nordic">北欧</button>
                <button class="tab-btn" data-region="japan">日本/亚洲</button>
                <button class="tab-btn" data-region="europe">欧洲</button>
                <button class="tab-btn" data-region="usa">北美</button>
                <button class="tab-btn" data-region="australia">澳洲</button>
            </div>
            
            <div class="roaster-scroll" id="roaster-tags">
                </div>
        </div>
    </div>

    <div class="toolbar">
        <div class="count">已收录 <span id="total-count" style="color:#fff; font-weight:600">0</span> 款</div>
        <div class="sort">
            <select id="sort-select" class="sort-select">
                <option value="rank-asc">👑 榜单排名 (Top 100)</option>
                <option value="newest">📅 最新发布</option>
            </select>
        </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="loading" id="sentinel">LOADING</div>

    <script>
        let allData = [];
        let filteredData = [];
        let loadedCount = 0;
        const BATCH_SIZE = 24;
        
        let currentRegion = 'all';
        let currentRoaster = 'all';
        let currentSort = 'rank-asc'; // 默认改为榜单排序

        // Roastful 2024 Top Roasters (权威榜单)
        // 名字必须模糊匹配 data.json 里的 roaster_name
        const TOP_ROASTERS = [
            "Tim Wendelboe", "Coffee Collective", "April", "Sey", "La Cabra", "Koppi", 
            "Nomad", "Onyx Coffee Lab", "ONA", "Manhattan", "Friedhats", "Kawa", 
            "DAK", "Momos", "Archers", "Heart", "Morgon", "Leaves", "Prodigal", 
            "Market Lane", "Colonna", "Code Black", "Gardelli", "Process", "Luna", 
            "Fjord", "Glitch", "Kurasu", "Onibus", "Mel", "Five Elephant", "The Barn",
            "Monogram", "Hatch", "Black & White", "Subtext", "Rogue Wave", "Passenger",
            "George Howell", "Cat & Cloud", "Brandywine", "Verve", "Proud Mary", "Seven Seeds"
        ];

        const regionMap = {
            'nordic': ['Denmark', 'Sweden', 'Norway', 'Finland'],
            'japan': ['Japan', 'Hong Kong', 'China', 'Korea', 'Taiwan'],
            'europe': ['Germany', 'Netherlands', 'Spain', 'Belgium', 'Italy', 'United Kingdom', 'France', 'Ireland'],
            'usa': ['USA', 'Canada'],
            'australia': ['Australia', 'New Zealand']
        };

        const placeholderSVG = `
            <div class="placeholder">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
            </div>`;

        async function init() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                if (!res.ok) throw new Error("Failed to load data");
                allData = await res.json();
                
                renderTags();
                applyFilterAndSort();
                
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) loadMore();
                }, { rootMargin: '300px' });
                observer.observe(document.getElementById('sentinel'));

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        
                        currentRegion = e.target.dataset.region;
                        currentRoaster = 'all';
                        
                        renderTags();
                        applyFilterAndSort();
                        document.getElementById('roaster-tags').scrollLeft = 0;
                    });
                });

                document.getElementById('sort-select').addEventListener('change', (e) => {
                    currentSort = e.target.value;
                    applyFilterAndSort();
                });

            } catch (e) {
                console.error(e);
            }
        }

        function getRoasterRank(name) {
            // 模糊匹配逻辑：只要包含榜单里的关键词，就算命中
            // 例如 data.json 是 "DAK Coffee", 榜单是 "DAK", 应该匹配
            const lowerName = name.toLowerCase();
            const index = TOP_ROASTERS.findIndex(rankName => lowerName.includes(rankName.toLowerCase()));
            return index === -1 ? 999 : index; // 没上榜的排最后
        }

        function renderTags() {
            const container = document.getElementById('roaster-tags');
            container.innerHTML = '';

            let roasters = [];
            if (currentRegion === 'all') {
                roasters = [...new Set(allData.map(d => d.roaster_name))];
            } else {
                const countries = regionMap[currentRegion] || [];
                roasters = [...new Set(allData.filter(d => countries.includes(d.roaster_country)).map(d => d.roaster_name))];
            }
            
            // 标签也按照榜单排序！
            roasters.sort((a, b) => getRoasterRank(a) - getRoasterRank(b));

            const allTag = document.createElement('div');
            allTag.className = `tag ${currentRoaster === 'all' ? 'active' : ''}`;
            allTag.innerText = '全部品牌';
            allTag.onclick = () => {
                currentRoaster = 'all';
                updateTagActive();
                applyFilterAndSort();
            };
            container.appendChild(allTag);

            roasters.forEach(name => {
                const tag = document.createElement('div');
                tag.className = `tag ${currentRoaster === name ? 'active' : ''}`;
                tag.innerText = name;
                tag.onclick = () => {
                    currentRoaster = (currentRoaster === name) ? 'all' : name;
                    updateTagActive();
                    applyFilterAndSort();
                };
                container.appendChild(tag);
            });
        }

        function updateTagActive() {
            const tags = document.getElementById('roaster-tags').children;
            for (let tag of tags) {
                const isActive = tag.innerText === (currentRoaster === 'all' ? '全部品牌' : currentRoaster);
                tag.classList.toggle('active', isActive);
            }
        }

        function applyFilterAndSort() {
            filteredData = allData.filter(d => {
                let regionMatch = (currentRegion === 'all') ? true : (regionMap[currentRegion] || []).includes(d.roaster_country);
                let roasterMatch = (currentRoaster === 'all') ? true : (d.roaster_name === currentRoaster);
                return regionMatch && roasterMatch;
            });

            // 排序逻辑
            filteredData.sort((a, b) => {
                if (currentSort === 'rank-asc') {
                    const rankA = getRoasterRank(a.roaster_name);
                    const rankB = getRoasterRank(b.roaster_name);
                    if (rankA !== rankB) return rankA - rankB;
                    // 排名相同（如同品牌），按时间新到旧
                    return new Date(b.published_at) - new Date(a.published_at);
                } else if (currentSort === 'newest') {
                    return new Date(b.published_at) - new Date(a.published_at);
                }
            });

            document.getElementById('total-count').innerText = filteredData.length;
            document.getElementById('grid').innerHTML = '';
            loadedCount = 0;
            window.scrollTo(0, 0);
            loadMore();
        }

        function loadMore() {
            const sentinel = document.getElementById('sentinel');
            if (loadedCount >= filteredData.length) {
                sentinel.innerText = filteredData.length === 0 ? "暂无数据" : "· THE END ·";
                sentinel.style.opacity = 0.5;
                return;
            }

            sentinel.innerText = "LOADING";
            sentinel.style.opacity = 1;

            const batch = filteredData.slice(loadedCount, loadedCount + BATCH_SIZE);
            const grid = document.getElementById('grid');

            batch.forEach(item => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = item.url;
                a.target = "_blank";

                let imgHtml = placeholderSVG;
                if (item.image && item.image.length > 10 && !item.image.includes('no-image')) {
                    imgHtml = `
                        ${placeholderSVG}
                        <img src="${item.image}" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
                    `;
                }

                a.innerHTML = `
                    <div class="img-box">
                        ${imgHtml}
                    </div>
                    <div class="info">
                        <div class="roaster">${item.roaster_name}</div>
                        <div class="bean-title">${item.name}</div>
                        <div class="price">${item.price || ''}</div>
                    </div>
                `;
                grid.appendChild(a);
            });

            loadedCount += batch.length;
        }

        init();
    </script>
</body>
</html>
