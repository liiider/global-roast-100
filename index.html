<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Global Roast 100 | 全球咖啡新豆榜</title>
    <style>
        /* --- 核心设计系统 --- */
        :root {
            --bg: #000000;
            --card-bg: #151517;
            --nav-bg: rgba(18, 18, 18, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #D4AF37; /* 香槟金，用于强调 */
            --text-main: #F5F5F7; /* iOS Off-white */
            --text-sec: #86868B;  /* iOS Grey */
            --safe-area: max(20px, env(safe-area-inset-left));
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            /* 核心：黄金字体栈 - 优先 iOS/Mac 原生字体，兼顾 Windows */
            font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased; /* 让字体更细更清晰 */
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Header --- */
        header {
            padding: 70px 20px 30px;
            text-align: center;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
        }

        .brand-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        h1 {
            font-size: 32px;
            font-weight: 600; /* 中文字体不宜太粗，600正好 */
            margin: 0;
            line-height: 1.2;
            letter-spacing: 1px;
            color: #fff;
        }

        /* 英文标题用衬线体，增加优雅感 */
        h1 .en {
            display: block;
            font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
            font-size: 20px;
            font-style: italic;
            font-weight: 400;
            color: var(--text-sec);
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* --- Sticky Filter Bar --- */
        .filter-sticky {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            backdrop-filter: saturate(180%) blur(20px); /* iOS 毛玻璃 */
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--border);
            padding-top: 12px;
            padding-bottom: 12px;
        }

        /* 隐藏滚动条容器 */
        .scroll-row {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 0 var(--safe-area);
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to right, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        /* 1. 地区文字 Tab */
        .region-row {
            margin-bottom: 12px;
            justify-content: center; /* PC端居中 */
        }
        @media (max-width: 768px) {
            .region-row { justify-content: flex-start; } /* 手机端左对齐 */
        }

        .tab-item {
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-sec);
            background: transparent;
            border: none;
            padding: 4px 0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 600;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }

        /* 2. 烘焙商 Tags */
        .roaster-row {
            padding-bottom: 4px;
            gap: 10px;
        }

        .tag {
            flex-shrink: 0;
            height: 30px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 400;
            transition: all 0.2s;
            cursor: pointer;
            border: 0.5px solid transparent;
        }

        .tag:active { transform: scale(0.96); opacity: 0.8; }

        .tag.active {
            background-color: var(--text-main);
            color: #000;
            font-weight: 600;
        }

        /* --- Grid & Card --- */
        .stats-info {
            text-align: right;
            padding: 15px var(--safe-area);
            font-size: 12px;
            color: var(--text-sec);
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            padding: 0 var(--safe-area) 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 极简卡片 */
        .card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: transparent;
            /* 初始隐藏，JS控制显示 */
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .card:hover .cover-img { transform: scale(1.06); }

        .img-box {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 */
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .cover-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .cover-img.loaded { opacity: 1; }

        /* 默认 SVG 占位 */
        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .info { padding: 0 2px; }

        .roaster {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .bean-title {
            font-size: 14px;
            color: #fff;
            line-height: 1.4;
            font-weight: 400; /* 细字体更显高级 */
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-family: "SF Mono", "Menlo", "Courier New", monospace; /* 等宽数字 */
            font-size: 13px;
            color: var(--text-main);
            opacity: 0.8;
        }

        /* --- Loading --- */
        .loading-state {
            padding: 40px 0;
            text-align: center;
            color: var(--text-sec);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- 移动端优化 --- */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr); /* 双列 */
                gap: 12px;
                padding: 0 16px 60px;
            }
            h1 { font-size: 26px; }
            h1 .en { font-size: 16px; }
            .tag { font-size: 12px; height: 28px; }
            .bean-title { font-size: 13px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-tag">GR100</div>
        <h1>
            全球咖啡新豆榜
            <span class="en">Global Roast Selection</span>
        </h1>
    </header>

    <div class="filter-sticky">
        <div class="scroll-row region-row" id="region-tabs">
            <button class="tab-item active" data-region="all">全部</button>
            <button class="tab-item" data-region="nordic">北欧</button>
            <button class="tab-item" data-region="japan">日本</button>
            <button class="tab-item" data-region="europe">欧洲</button>
            <button class="tab-item" data-region="usa">北美</button>
            <button class="tab-item" data-region="australia">澳洲</button>
        </div>
        
        <div class="scroll-row roaster-row" id="roaster-tags">
            </div>
    </div>

    <div class="stats-info">
        收录 <span id="total-count" style="color:#fff; font-weight:600">0</span> 款
    </div>

    <div class="grid" id="grid">
        </div>

    <div class="loading-state" id="sentinel">LOADING</div>

    <script>
        let allData = [];
        let filteredData = [];
        let loadedCount = 0;
        const BATCH_SIZE = 20;
        
        let currentRegion = 'all';
        let currentRoaster = 'all';

        const regionMap = {
            'nordic': ['Denmark', 'Sweden', 'Norway', 'Finland'],
            'japan': ['Japan', 'Hong Kong', 'China', 'Korea', 'Taiwan'],
            'europe': ['Germany', 'Netherlands', 'Spain', 'Belgium', 'Italy', 'United Kingdom', 'France', 'Ireland'],
            'usa': ['USA', 'Canada'],
            'australia': ['Australia', 'New Zealand']
        };

        // 优雅的占位图 SVG
        const placeholderSVG = `
            <div class="placeholder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
            </div>`;

        async function init() {
            try {
                // 增加时间戳参数，避免缓存
                const res = await fetch('data.json?t=' + Date.now());
                if (!res.ok) throw new Error("Data not found");
                allData = await res.json();
                
                renderRoasterTags();
                applyFilter();
                
                // 无限滚动
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) loadMore();
                }, { rootMargin: '300px' }); // 提前加载，体验更流畅
                observer.observe(document.getElementById('sentinel'));

                // 地区点击
                document.querySelectorAll('.tab-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        
                        currentRegion = e.target.dataset.region;
                        currentRoaster = 'all';
                        
                        renderRoasterTags();
                        applyFilter();
                        
                        // 切换地区时，标签栏归位
                        document.getElementById('roaster-tags').scrollTo({left: 0, behavior: 'smooth'});
                    });
                });

            } catch (e) {
                console.error(e);
                document.getElementById('sentinel').innerText = "暂无数据";
            }
        }

        function renderRoasterTags() {
            const container = document.getElementById('roaster-tags');
            container.innerHTML = '';

            let roasters = [];
            if (currentRegion === 'all') {
                roasters = [...new Set(allData.map(d => d.roaster_name))];
            } else {
                const countries = regionMap[currentRegion] || [];
                roasters = [...new Set(allData.filter(d => countries.includes(d.roaster_country)).map(d => d.roaster_name))];
            }
            roasters.sort();

            // "全部" 胶囊
            const allTag = createTag('全部品牌', 'all');
            container.appendChild(allTag);

            roasters.forEach(name => {
                container.appendChild(createTag(name, name));
            });
        }

        function createTag(text, value) {
            const div = document.createElement('div');
            div.className = `tag ${currentRoaster === value ? 'active' : ''}`;
            div.innerText = text;
            div.onclick = () => {
                if (currentRoaster === value && value !== 'all') {
                    setRoaster('all'); // 反选
                } else {
                    setRoaster(value);
                }
            };
            return div;
        }

        function setRoaster(name) {
            currentRoaster = name;
            const tags = document.getElementById('roaster-tags').children;
            for (let tag of tags) {
                const isActive = tag.innerText === (name === 'all' ? '全部品牌' : name);
                tag.classList.toggle('active', isActive);
                if (isActive) {
                    tag.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
                }
            }
            applyFilter();
        }

        function applyFilter() {
            filteredData = allData.filter(d => {
                let regionMatch = (currentRegion === 'all') ? true : (regionMap[currentRegion] || []).includes(d.roaster_country);
                let roasterMatch = (currentRoaster === 'all') ? true : (d.roaster_name === currentRoaster);
                return regionMatch && roasterMatch;
            });

            document.getElementById('total-count').innerText = filteredData.length;
            document.getElementById('grid').innerHTML = '';
            loadedCount = 0;
            window.scrollTo(0, 0);
            loadMore();
        }

        function loadMore() {
            const sentinel = document.getElementById('sentinel');
            if (loadedCount >= filteredData.length) {
                sentinel.innerText = filteredData.length === 0 ? "暂无收录" : "· END ·";
                sentinel.style.opacity = 0.5;
                return;
            }

            sentinel.innerText = "LOADING...";
            sentinel.style.opacity = 1;
            
            const batch = filteredData.slice(loadedCount, loadedCount + BATCH_SIZE);
            const grid = document.getElementById('grid');

            batch.forEach(item => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = item.url;
                a.target = "_blank";

                let imgHtml = placeholderSVG;
                // 简单判断图片有效性
                if (item.image && item.image.length > 10 && !item.image.includes('no-image')) {
                    imgHtml = `
                        ${placeholderSVG}
                        <img class="cover-img" src="${item.image}" loading="lazy" 
                             onload="this.classList.add('loaded')" 
                             onerror="this.style.display='none'">
                    `;
                }

                a.innerHTML = `
                    <div class="img-box">
                        ${imgHtml}
                    </div>
                    <div class="info">
                        <div class="roaster">${item.roaster_name}</div>
                        <div class="bean-title">${item.name}</div>
                        <div class="price">${item.price}</div>
                    </div>
                `;
                grid.appendChild(a);
            });

            loadedCount += batch.length;
        }

        init();
    </script>
</body>
</html>
