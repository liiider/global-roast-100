<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Roast 100 | 全球咖啡新豆榜</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --primary: #d4af37; /* 香槟金 */
            --text: #e0e0e0;
            --text-sub: #757575;
            --border: #222;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            padding: 60px 20px 40px;
            text-align: center;
            background: linear-gradient(to bottom, #000, var(--bg));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            margin: 0 0 10px;
            letter-spacing: 2px;
            color: #fff;
        }

        h1 span {
            font-family: "Times New Roman", serif;
            font-style: italic;
            color: var(--primary);
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* 筛选区 */
        .filter-container {
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        /* 地区筛选 (一级) */
        .region-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 5px 0;
            position: relative;
            transition: color 0.3s;
        }

        .tab-btn:hover { color: #fff; }
        
        .tab-btn.active { 
            color: #fff; 
            font-weight: 500; 
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
        }

        /* 烘焙商筛选 (二级 - 滚动条) */
        .roaster-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 20px 10px; /* 底部留白防滚动条 */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE */
            justify-content: flex-start; /* 默认左对齐 */
        }
        
        /* PC端如果标签少，居中显示 */
        @media(min-width: 768px) {
            .roaster-scroll { justify-content: center; }
        }

        .roaster-scroll::-webkit-scrollbar { display: none; }

        .tag {
            flex-shrink: 0;
            padding: 6px 16px;
            border-radius: 100px;
            background: var(--surface);
            color: var(--text-sub);
            font-size: 0.8rem;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag:hover {
            border-color: #666;
            color: #fff;
        }

        .tag.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
            font-weight: 600;
        }

        /* 统计 */
        .stats {
            max-width: 1400px;
            margin: 20px auto 0;
            padding: 0 30px;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* 瀑布流网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px; /* 间距大一点，更有呼吸感 */
            padding: 20px 30px 80px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 卡片 */
        .card {
            display: block; /* 整个卡片是链接 */
            text-decoration: none;
            background: transparent;
            transition: transform 0.3s ease, opacity 0.5s ease;
            opacity: 0;
            animation: fadeInUp 0.6s forwards;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 正方形 */
            background-color: #151515;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease, transform 0.5s ease;
            opacity: 0; /* 默认透明，加载完显示 */
        }
        
        .card-img.loaded { opacity: 1; }
        .card:hover .card-img { transform: scale(1.04); }

        /* 默认图片占位 (SVG) */
        .placeholder-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #333;
            background: #111;
        }

        .card-info { padding: 0 5px; }

        .roaster {
            font-size: 0.7rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .title {
            font-size: 1rem;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 8px;
            font-weight: 400;
            /* 限制两行 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-family: "Courier New", monospace;
            font-size: 0.9rem;
            color: #888;
        }

        /* 底部 Loading */
        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端微调 */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 15px;
            }
            .tab-btn { font-size: 0.85rem; }
            h1 { font-size: 1.8rem; }
            .title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle">TOP 100 ROASTERS</div>
        <h1>全球 <span>咖啡新豆榜</span></h1>
        <div class="subtitle">30天内新鲜出品 · 实时更新</div>
    </header>

    <div class="filter-container">
        <div class="region-tabs" id="region-tabs">
            <button class="tab-btn active" data-region="all">全部</button>
            <button class="tab-btn" data-region="nordic">北欧</button>
            <button class="tab-btn" data-region="europe">欧洲</button>
            <button class="tab-btn" data-region="japan">日本</button>
            <button class="tab-btn" data-region="australia">澳洲</button>
            <button class="tab-btn" data-region="usa">北美</button>
        </div>
        <div class="roaster-scroll" id="roaster-tags">
            </div>
    </div>

    <div class="stats">
        已收录 <span id="total-count" style="color:#fff">0</span> 款
    </div>

    <div class="grid" id="grid"></div>
    
    <div class="loading-indicator" id="sentinel">LOADING...</div>

    <script>
        let allData = [];
        let filteredData = [];
        let loadedCount = 0;
        const BATCH_SIZE = 20;
        
        let currentRegion = 'all';
        let currentRoaster = 'all';

        const regionMap = {
            'nordic': ['Denmark', 'Sweden', 'Norway'],
            'japan': ['Japan', 'Hong Kong'],
            'europe': ['Germany', 'Netherlands', 'Spain', 'Belgium', 'Italy', 'United Kingdom', 'France'],
            'usa': ['USA', 'Canada'],
            'australia': ['Australia', 'New Zealand']
        };

        async function init() {
            try {
                const res = await fetch('data.json');
                allData = await res.json();
                
                // 初始渲染
                renderRoasterTags();
                applyFilter();
                
                // 启动无限滚动
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) loadMore();
                }, { rootMargin: '400px' });
                observer.observe(document.getElementById('sentinel'));

                // 绑定地区点击
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        
                        currentRegion = e.target.dataset.region;
                        currentRoaster = 'all'; // 重置烘焙商
                        
                        renderRoasterTags();
                        applyFilter();
                    });
                });

            } catch (e) {
                console.error(e);
                document.getElementById('sentinel').textContent = "数据加载失败";
            }
        }

        function renderRoasterTags() {
            const container = document.getElementById('roaster-tags');
            container.innerHTML = '';

            // 筛选当前地区的品牌
            let roasters = [];
            if (currentRegion === 'all') {
                roasters = [...new Set(allData.map(d => d.roaster_name))];
            } else {
                const countries = regionMap[currentRegion] || [];
                roasters = [...new Set(allData.filter(d => countries.includes(d.roaster_country)).map(d => d.roaster_name))];
            }
            roasters.sort();

            // 添加"全部"标签
            const allTag = document.createElement('div');
            allTag.className = `tag ${currentRoaster === 'all' ? 'active' : ''}`;
            allTag.textContent = '全部品牌';
            allTag.onclick = () => { setRoaster('all'); };
            container.appendChild(allTag);

            roasters.forEach(name => {
                const tag = document.createElement('div');
                tag.className = `tag ${currentRoaster === name ? 'active' : ''}`;
                tag.textContent = name;
                tag.onclick = () => { setRoaster(name); };
                container.appendChild(tag);
            });
        }

        function setRoaster(name) {
            currentRoaster = (currentRoaster === name) ? 'all' : name;
            
            // 更新UI状态
            document.querySelectorAll('.tag').forEach(t => {
                if (t.textContent === (currentRoaster === 'all' ? '全部品牌' : currentRoaster)) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });
            
            applyFilter();
        }

        function applyFilter() {
            filteredData = allData.filter(d => {
                // 地区匹配
                let regionMatch = true;
                if (currentRegion !== 'all') {
                    const countries = regionMap[currentRegion] || [];
                    regionMatch = countries.includes(d.roaster_country);
                }
                // 品牌匹配
                let roasterMatch = true;
                if (currentRoaster !== 'all') {
                    roasterMatch = d.roaster_name === currentRoaster;
                }
                return regionMatch && roasterMatch;
            });

            document.getElementById('total-count').textContent = filteredData.length;
            document.getElementById('grid').innerHTML = '';
            loadedCount = 0;
            loadMore();
        }

        function loadMore() {
            if (loadedCount >= filteredData.length) {
                document.getElementById('sentinel').textContent = filteredData.length ? "—— THE END ——" : "暂无新豆";
                return;
            }

            const batch = filteredData.slice(loadedCount, loadedCount + BATCH_SIZE);
            const grid = document.getElementById('grid');

            batch.forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = item.url;
                card.target = "_blank";

                // 默认占位图 (SVG)
                const fallbackHtml = `
                    <div class="placeholder-img">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </div>`;

                let imgHtml = fallbackHtml;
                if (item.image && item.image.length > 5) {
                    // onerror事件处理图片挂了的情况
                    imgHtml = `
                        ${fallbackHtml}
                        <img class="card-img" src="${item.image}" loading="lazy" 
                             onload="this.classList.add('loaded')" 
                             onerror="this.style.display='none'">
                    `;
                }

                card.innerHTML = `
                    <div class="card-img-wrap">
                        ${imgHtml}
                    </div>
                    <div class="card-info">
                        <div class="roaster">${item.roaster_name}</div>
                        <div class="title">${item.name}</div>
                        <div class="price">${item.price}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            loadedCount += batch.length;
        }

        init();
    </script>
</body>
</html>
