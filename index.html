<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Roast 100 | 全球百大咖啡新豆榜</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #888888;
            --accent: #d4af37;
            --tag-bg: #1a1a1a;
            --tag-border: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* 顶部 Header */
        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, var(--bg-color) 100%);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        h1 span {
            font-family: "Times New Roman", serif;
            font-style: italic;
            color: var(--accent);
            font-weight: bold;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* 筛选容器 */
        .filter-section {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            padding: 15px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        /* 第一行：地区筛选 */
        .region-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .region-btn {
            background: transparent;
            border: 1px solid var(--text-sub);
            color: var(--text-sub);
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .region-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .region-btn.active {
            background-color: var(--text-main);
            color: #000;
            border-color: var(--text-main);
            font-weight: bold;
        }

        /* 第二行：烘焙商标签 */
        .roaster-filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 10px;
            border-top: 1px solid #222;
        }

        .roaster-tag {
            background-color: var(--tag-bg);
            border: 1px solid var(--tag-border);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .roaster-tag:hover {
            border-color: #666;
            color: #fff;
        }

        .roaster-tag.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: bold;
        }

        /* 统计栏 */
        .status-bar {
            text-align: right;
            padding: 10px 40px;
            font-size: 0.8rem;
            color: #444;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px 40px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 卡片样式 */
        .card {
            background-color: transparent;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* 初始状态用于动画 */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover .img-container img {
            transform: scale(1.05);
        }

        .img-container {
            width: 100%;
            padding-top: 100%; /* 1:1 正方形 */
            position: relative;
            background-color: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .card img.loaded {
            opacity: 1;
        }

        .info {
            padding: 12px 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .roaster-name {
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .bean-name {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
            color: #eee;
            /* 限制显示两行 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 8px;
        }

        .price {
            font-family: monospace;
            font-size: 0.85rem;
            color: #888;
        }

        .shop-link {
            text-decoration: none;
            font-size: 0.7rem;
            color: #fff;
            background-color: #222;
            padding: 4px 10px;
            border-radius: 2px;
            transition: background 0.2s;
        }

        .shop-link:hover {
            background-color: var(--accent);
            color: #000;
        }

        /* 加载哨兵 */
        #sentinel {
            height: 50px;
            width: 100%;
            text-align: center;
            color: #333;
            padding: 20px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
                gap: 10px;
            }
            .region-filters {
                justify-content: flex-start;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 5px;
            }
            .roaster-filters {
                justify-content: flex-start;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 5px;
            }
            header { padding: 30px 15px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle">CURATED SELECTION</div>
        <h1>全球百大 <span>咖啡新豆榜</span></h1>
        <div class="subtitle">每日追踪 100+ 顶级烘焙品牌 · 甄选 30 天内新鲜出品</div>
    </header>

    <div class="filter-section">
        <div class="region-filters" id="region-filters">
            <button class="region-btn active" data-region="all">全部地区</button>
            <button class="region-btn" data-region="nordic">北欧</button>
            <button class="region-btn" data-region="japan">日本/亚洲</button>
            <button class="region-btn" data-region="europe">欧洲</button>
            <button class="region-btn" data-region="usa">北美</button>
            <button class="region-btn" data-region="australia">澳洲</button>
        </div>
        
        <div class="roaster-filters" id="roaster-filters">
            </div>
    </div>

    <div class="status-bar">
        当前展示: <span id="current-count" style="color:#fff">0</span> / <span id="total-count">0</span>
    </div>

    <div class="grid" id="grid">
        </div>

    <div id="sentinel">Loading...</div>

    <script>
        let allData = [];
        let filteredData = [];
        let currentRoasterFilter = 'all'; // 当前选中的烘焙商
        let currentRegionFilter = 'all';  // 当前选中的地区
        
        let loadedCount = 0;
        const batchSize = 24; // 每次滑到底部加载 24 个

        const regionMap = {
            'nordic': ['Denmark', 'Sweden', 'Norway'],
            'japan': ['Japan', 'Hong Kong'],
            'europe': ['Germany', 'Netherlands', 'Spain', 'Belgium', 'Italy', 'United Kingdom'],
            'usa': ['USA', 'Canada'],
            'australia': ['Australia', 'New Zealand']
        };

        async function init() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Failed to load');
                allData = await response.json();

                // 初始渲染
                renderRoasterTags('all'); // 显示所有烘焙商标签
                applyFilter();
                setupInfiniteScroll();
                
                // 绑定地区点击事件
                document.querySelectorAll('.region-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // 样式切换
                        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        
                        // 逻辑更新
                        currentRegionFilter = e.target.dataset.region;
                        currentRoasterFilter = 'all'; // 切换地区时重置烘焙商选择
                        
                        renderRoasterTags(currentRegionFilter); // 重新生成该地区的烘焙商标签
                        applyFilter();
                    });
                });

            } catch (error) {
                console.error(error);
                document.getElementById('sentinel').textContent = "无法加载数据，请确保 data.json 存在";
            }
        }

        // 核心：动态生成烘焙商标签
        function renderRoasterTags(region) {
            const container = document.getElementById('roaster-filters');
            container.innerHTML = ''; // 清空

            // 1. 筛选出属于当前地区的烘焙商
            let roasters = [];
            if (region === 'all') {
                roasters = [...new Set(allData.map(d => d.roaster_name))];
            } else {
                const countries = regionMap[region];
                const regionData = allData.filter(d => countries.includes(d.roaster_country));
                roasters = [...new Set(regionData.map(d => d.roaster_name))];
            }
            roasters.sort();

            // 2. 添加 "全部" 标签
            const allBtn = document.createElement('button');
            allBtn.className = `roaster-tag ${currentRoasterFilter === 'all' ? 'active' : ''}`;
            allBtn.textContent = '所有品牌';
            allBtn.onclick = () => {
                currentRoasterFilter = 'all';
                updateTagStyles();
                applyFilter();
            };
            container.appendChild(allBtn);

            // 3. 添加各个烘焙商标签
            roasters.forEach(name => {
                const btn = document.createElement('button');
                btn.className = `roaster-tag ${currentRoasterFilter === name ? 'active' : ''}`;
                btn.textContent = name;
                btn.onclick = () => {
                    // 点击逻辑：如果点已选中的，则取消选中；否则选中它
                    if (currentRoasterFilter === name) {
                        currentRoasterFilter = 'all';
                    } else {
                        currentRoasterFilter = name;
                    }
                    updateTagStyles();
                    applyFilter();
                };
                container.appendChild(btn);
            });
        }

        function updateTagStyles() {
            const btns = document.querySelectorAll('.roaster-tag');
            btns.forEach(btn => {
                if (btn.textContent === '所有品牌' && currentRoasterFilter === 'all') {
                    btn.classList.add('active');
                } else if (btn.textContent === currentRoasterFilter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 核心：筛选逻辑
        function applyFilter() {
            filteredData = allData.filter(item => {
                // 1. 地区判断
                let regionMatch = true;
                if (currentRegionFilter !== 'all') {
                    const countries = regionMap[currentRegionFilter];
                    regionMatch = countries && countries.includes(item.roaster_country);
                }
                
                // 2. 烘焙商判断
                let roasterMatch = true;
                if (currentRoasterFilter !== 'all') {
                    roasterMatch = item.roaster_name === currentRoasterFilter;
                }
                
                return regionMatch && roasterMatch;
            });

            // 更新总数显示
            document.getElementById('total-count').textContent = filteredData.length;
            
            // 重置网格
            document.getElementById('grid').innerHTML = '';
            loadedCount = 0;
            
            // 立即加载第一批
            loadMore();
        }

        // 核心：分批加载 (无限滚动用)
        function loadMore() {
            const grid = document.getElementById('grid');
            const sentinel = document.getElementById('sentinel');

            // 如果已经加载完了
            if (loadedCount >= filteredData.length) {
                sentinel.textContent = filteredData.length > 0 ? "—— 底线 ——" : "暂无数据";
                return;
            }

            sentinel.textContent = "Loading...";

            // 截取下一批数据
            const nextBatch = filteredData.slice(loadedCount, loadedCount + batchSize);
            
            nextBatch.forEach(item => {
                const card = createCard(item);
                grid.appendChild(card);
            });

            loadedCount += nextBatch.length;
            document.getElementById('current-count').textContent = loadedCount;

            // 如果一次就加载完了，隐藏 loading
            if (loadedCount >= filteredData.length) {
                sentinel.textContent = "—— 底线 ——";
            }
        }

        function createCard(item) {
            const div = document.createElement('div');
            div.className = 'card';
            
            // 图片逻辑：优先加载，失败则显示默认图
            let imgTag = '';
            if (item.image && item.image.length > 5) {
                imgTag = `<img src="${item.image}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none'">`;
            }

            div.innerHTML = `
                <div class="img-container">
                    ${imgTag}
                </div>
                <div class="info">
                    <div class="roaster-name">${item.roaster_name}</div>
                    <div class="bean-name" title="${item.name}">${item.name}</div>
                    <div class="meta">
                        <span class="price">${item.price || ''}</span>
                        <a href="${item.url}" target="_blank" class="shop-link">BUY</a>
                    </div>
                </div>
            `;
            return div;
        }

        // 核心：无限滚动监听器
        function setupInfiniteScroll() {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    // 当用户看到底部的 sentinel 时，加载更多
                    loadMore();
                }
            }, { rootMargin: '200px' }); // 提前 200px 开始加载，体验更流畅

            observer.observe(document.getElementById('sentinel'));
        }

        init();
    </script>
</body>
</html>
