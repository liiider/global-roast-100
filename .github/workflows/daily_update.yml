name: Daily Coffee Scraper

on:
  schedule:
    # 每天 UTC 时间 0点 (北京时间 早上8点) 运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击按钮运行

permissions:
  contents: write # 赋予写权限，以便将 data.json 推送回仓库

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装爬虫所需的库
          pip install requests beautifulsoup4 playwright
          # 安装 Playwright 浏览器内核
          playwright install chromium

      - name: Run Scraper
        run: python scrape_coffee.py

      - name: Commit and Push changes
        run: |
          # 1. 配置 Git 机器人身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 2. 先暂存并提交本地修改 (关键步骤：这会让工作区变干净，避免冲突)
          git add data.json
          git commit -m "Auto-update coffee data $(date +'%Y-%m-%d')" || echo "No changes to commit"
          
          # 3. 拉取远程最新代码 (使用 rebase 保持提交记录整洁)
          git pull --rebase origin main
          
          # 4. 推送到 GitHub
          git push origin main
