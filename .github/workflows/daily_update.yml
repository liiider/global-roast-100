name: Daily Coffee Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点 (北京时间 8点)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Scraper
        run: python scrape_coffee.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'CoffeeBot'
          git config --global user.email 'bot@noreply.github.com'
          git add data.json
          # 只有当数据有变化时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update coffee data" && git push)
