name: Daily Coffee Scraper

# 触发条件：每天国际标准时间 00:00 (北京时间早上 8:00) 运行
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮立刻运行 (方便测试)

permissions:
  contents: write # 必须给写入权限，否则无法更新 data.json

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scrape_coffee.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'CoffeeBot'
          git config --global user.email 'bot@noreply.github.com'
          git add data.json
          # 如果有变动才提交，没变动(exit 0)不报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "☕ Auto-update coffee data" && git push)
